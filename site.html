        {date:"2021年1月 — 2021年2月", place:"シンガポール", org:"データ分析・数理統計プログラム", role:"シンガポール国立大学 — 個人優秀修了証", list:["定量的手法と RStudio を用いて複雑なデータセットを整備・探索し、モデル学習に必要なデータ品質を確保。","契約・規制情報でリーガル AI を学習させる際に応用できるデータラベリングと分類の手法を実践。"]},
        {date:"進行中", place:"日本 東京", org:"海洋法に関する研究執筆", role:"早稲田大学大学院での研究", body:"気候変動による海面上昇が国連海洋法条約（UNCLOS）の基線規定にどのように関わるかを扱っています。完成した論文は本欄に掲載します。"}
      ],
      asideH:"手法", aside:["定量的手法、RStudio","データラベリングと分類","市場・規制リサーチ","法務サービスのワークフロー設計"],
      cta:""
    },
    footer:["東京 · 北京","bellachenj714@gmail.com"]
  }
};


var LANGS = ["zh","en","ja"], LANGLABEL = {zh:"中文", en:"English", ja:"日本語"};
var IDS = ["profile","education","experience","projects"];
var CUR_LANG = 'en', CUR_PAGE = 'profile';

function nav(t, cur){
  var links = IDS.map(function(id){
    var on = id === cur;
    return '<a href="#' + id + '" style="font-size:16px;letter-spacing:0.1em;padding:6px 2px;border-bottom:2px solid ' + (on ? 'var(--color-accent)' : 'transparent') + (on ? ';color:var(--color-accent-700)' : ';color:var(--color-text)') + '">' + t.dir[id] + '</a>';
  }).join('');
  var picker = LANGS.map(function(l){
    var on = l === CUR_LANG;
    return '<a href="#" data-setlang="' + l + '" style="font-family:var(--font-heading);font-size:14px;letter-spacing:0.08em;padding:5px 14px;border:1px solid ' + (on ? 'var(--color-accent)' : 'var(--color-divider)') + ';border-radius:var(--radius-sm)' + (on ? ';color:var(--color-accent-700);background:rgba(255,255,255,0.45)' : ';color:var(--color-neutral-600)') + '">' + LANGLABEL[l] + '</a>';
  }).join('');
  return '<div style="max-width:1180px;margin:0 auto;border-top:1px solid var(--color-accent);border-bottom:1px solid var(--color-accent);display:flex;justify-content:space-between;align-items:center;gap:var(--space-6);padding:var(--space-3) 0;font-family:var(--font-heading);background:rgba(255,255,255,0.18)">' +
    '<div style="display:flex;gap:var(--space-6);padding-left:var(--space-2)">' + links + '</div>' +
    '<div style="display:flex;align-items:center;gap:var(--space-3);padding-right:var(--space-2)">' +
      '<span style="font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--color-accent-700)">' + (t.langLabel || 'Language') + '</span>' +
      '<div style="display:flex;gap:var(--space-2)">' + picker + '</div></div></div>';
}
function head(t, big, kicker, alt, right){
  return '<div style="max-width:1180px;margin:0 auto;border-top:2px solid var(--color-text);padding:var(--space-4) 0 var(--space-3);display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-6)">' +
    '<div>' + (kicker ? '<div style="font-size:11px;letter-spacing:0.24em;text-transform:uppercase;color:var(--color-accent-700)">' + kicker + '</div>' : '') +
    '<h1 style="font-size:' + (big === true ? '64px' : '52px') + ';font-weight:600;letter-spacing:0.01em;margin:var(--space-2) 0 0">' + (big === true ? t.name : big) + '</h1>' +
    (alt ? '<div style="font-family:var(--font-heading);font-size:22px;color:var(--color-neutral-700);letter-spacing:0.08em">' + alt + '</div>' : '') + '</div>' +
    '<div style="text-align:right;font-size:12px;line-height:1.9;color:var(--color-neutral-700);font-variant-numeric:tabular-nums">' + right + '</div></div>';
}
function foot(t){
  return '<div style="max-width:1180px;margin:var(--space-8) auto 0;border-top:1px solid var(--color-divider);padding:var(--space-4) 0;display:flex;justify-content:space-between;font-size:12px;color:var(--color-neutral-700);font-variant-numeric:tabular-nums">' + (t.footer[0] ? '<span>' + t.footer[0] + '</span>' : '') + '<span>' + t.footer[1] + '</span></div>';
}
function h6(x){ return '<h6 style="color:var(--color-accent-700)">' + x + '</h6>'; }

function renderProfile(t){
  var p = t.profile;
  var langs = p.langs.map(function(l){
    return '<div style="padding:var(--space-3) 0;border-bottom:1px solid var(--color-divider)"><div style="font-family:var(--font-heading);font-size:20px">' + l[0] + '</div><div class="text-muted" style="font-size:13px;margin-top:2px">' + l[1] + '</div></div>';
  }).join('');
  var cards = p.cards.map(function(c){
    return '<a class="card" href="#' + c[3] + '" style="border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-6);color:var(--color-text);display:block">' +
      '<div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-accent-700);font-variant-numeric:tabular-nums">' + c[0] + '</div>' +
      '<h4 style="margin:var(--space-2) 0;font-weight:600">' + c[1] + '</h4>' +
      '<p class="text-muted" style="margin:0;font-size:14px">' + c[2] + '</p></a>';
  }).join('');
  return head(t, true, t.kicker, t.alt, t.meta.map(function(m){return '<div>' + m + '</div>';}).join('')) +
    nav(t, 'profile') +
    '<div style="max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.5fr 1fr 1fr;padding-top:var(--space-6)">' +
      '<section style="padding-right:var(--space-6);border-right:1px solid var(--color-divider)">' + h6(p.h) +
        '<p style="font-family:var(--font-heading);font-size:27px;line-height:1.45;margin-bottom:var(--space-4);text-wrap:pretty">' + p.lead + '</p>' +
        '<div style="text-align:justify;line-height:1.85;font-size:15px;hyphens:auto">' + p.paras.map(function(x){return '<p>' + x + '</p>';}).join('') + '</div></section>' +
      '<section style="padding:0 var(--space-6);border-right:1px solid var(--color-divider)">' + h6(p.langH) + langs +
        '<h6 style="color:var(--color-accent-700);margin-top:var(--space-6)">' + p.skillsH + '</h6>' +
        '<div class="text-muted" style="font-size:14px;line-height:2.1">' + p.skills.join('<br>') + '</div></section>' +
      '<section style="padding-left:var(--space-6)">' + h6(p.nowH) +
        '<p style="font-size:15px;line-height:1.85;text-align:justify">' + p.now + '</p><div class="hr"></div>' + h6(p.contactH) +
        '<div style="font-size:13px;line-height:2;color:var(--color-neutral-700);font-variant-numeric:tabular-nums">' + p.contact.map(function(c){return '<div>' + c + '</div>';}).join('') + '</div>' +
        (p.cta ? '<a class="btn btn-primary btn-block" href="mailto:bellachenj714@gmail.com">' + p.cta + '</a>' : '') + '</section></div>' +
    '<div style="max-width:1180px;margin:var(--space-8) auto 0;border-top:1px solid var(--color-divider);padding-top:var(--space-6);display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6)">' + cards + '</div>' +
    foot(t);
}

function entry(it){
  var body = it.list
    ? '<ul style="margin:0;padding-left:1.1em;line-height:1.9;text-align:justify">' + it.list.map(function(x){return '<li>' + x + '</li>';}).join('') + '</ul>'
    : '<p style="text-align:justify;margin:0">' + it.body + '</p>';
  return '<article style="display:grid;grid-template-columns:200px 1fr;gap:var(--space-6);padding:var(--space-6) 0;border-bottom:1px solid var(--color-divider)">' +
    '<div><div style="font-size:12px;letter-spacing:0.1em;color:var(--color-accent-700);font-variant-numeric:tabular-nums">' + it.date + '</div>' +
    '<div class="text-muted" style="font-size:13px;margin-top:var(--space-1)">' + it.place + '</div></div>' +
    '<div><h3 style="margin:0;font-weight:600">' + it.org + '</h3>' +
    '<div style="font-family:var(--font-heading);font-size:17px;color:var(--color-neutral-700);margin-bottom:var(--space-3)">' + it.role + '</div>' + body + '</div></article>';
}

function renderSection(t, key){
  var s = t[key];
  var aside = h6(s.asideH) + (s.aside
      ? '<div class="text-muted" style="font-size:14px;line-height:1.9">' + s.aside.map(function(x, i){
          return '<div style="padding:var(--space-3) 0' + (i === s.aside.length - 1 ? '' : ';border-bottom:1px solid var(--color-divider)') + '">' + x + '</div>';
        }).join('') + '</div>'
      : '<p class="text-muted" style="font-size:14px;line-height:1.9;text-align:justify">' + s.asideText + '</p>') +
    (s.langs ? '<h6 style="color:var(--color-accent-700);margin-top:var(--space-8)">' + s.langH + '</h6>' +
      '<div class="text-muted" style="font-size:14px;line-height:1.9">' + s.langs.join('<br>') + '</div>' : '') +
    (s.next ? '<a class="btn btn-secondary btn-block" href="#' + s.nextId + '" style="margin-top:var(--space-6)">' + s.next + '</a>'
            : (s.cta ? '<a class="btn btn-primary btn-block" href="mailto:bellachenj714@gmail.com" style="margin-top:var(--space-6)">' + s.cta + '</a>' : ''));
  var cap = s.cap ? '<div style="padding-top:var(--space-6)">' + h6(s.capH) +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6)">' + s.cap.map(function(c){
        return '<div><div style="font-family:var(--font-heading);font-size:18px;padding-bottom:var(--space-2);border-bottom:1px solid var(--color-divider)">' + c[0] + '</div>' +
          '<div class="text-muted" style="font-size:14px;line-height:2;margin-top:var(--space-2)">' + c[1].join('<br>') + '</div></div>';
      }).join('') + '</div></div>' : '';
  return head(t, s.title, s.kicker, '', '<a href="#profile">' + t.back + '</a>') +
    nav(t, key) +
    '<div style="max-width:1180px;margin:0 auto;padding-top:var(--space-8);display:grid;grid-template-columns:1fr 300px;gap:var(--space-8)">' +
      '<div>' + s.items.map(entry).join('') + cap + '</div>' +
      '<aside style="border-left:1px solid var(--color-divider);padding-left:var(--space-6)">' + aside + '</aside></div>' +
    foot(t);
}

function render(replay){
  var t = DATA[CUR_LANG];
  document.documentElement.lang = CUR_LANG;
  var inner = CUR_PAGE === 'profile' ? renderProfile(t) : renderSection(t, CUR_PAGE);
  document.getElementById('app').innerHTML = '<div class="page" style="padding:var(--space-6)">' + inner + '</div>';
  window.scrollTo(0, 0);
  if (replay && document.body.classList.contains('entered')) {
    document.body.classList.remove('intro');
    void document.body.offsetWidth;
    document.body.classList.add('intro');
    clearTimeout(window.__introT);
    window.__introT = setTimeout(function(){ document.body.classList.remove('intro'); }, 1150);
  }
}

(function(){
  if (window.__resources && window.__resources.waterImg) {
    var w = window.__resources.waterImg, l = window.__resources.lilyImg || w;
    var st = document.createElement('style');
    st.textContent = "body{background-image:url('" + l + "') !important}body.entered{background-image:url('" + l + "') !important}";
    document.head.appendChild(st);
  }
  var stored = null;
  try { stored = localStorage.getItem('yj-lang'); } catch (e) {}
  if (stored && DATA[stored]) CUR_LANG = stored;

  var splash = document.getElementById('splash');
  function enter(){
    render();
    if (splash && !splash.classList.contains('leaving')) {
      splash.classList.add('leaving');
      document.body.classList.add('entered');
      document.body.classList.add('intro');
      setTimeout(function(){ if (splash && splash.parentNode) splash.parentNode.removeChild(splash); }, 600);
      setTimeout(function(){ document.body.classList.remove('intro'); }, 1150);
    }
  }
  document.getElementById('enterBtn').addEventListener('click', enter);

  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('[data-setlang]');
    if (!a) return;
    e.preventDefault();
    CUR_LANG = a.getAttribute('data-setlang');
    try { localStorage.setItem('yj-lang', CUR_LANG); } catch (e2) {}
    render(true);
  });

  function fromHash(){
    var id = location.hash.slice(1);
    CUR_PAGE = IDS.indexOf(id) >= 0 ? id : 'profile';
  }
  window.addEventListener('hashchange', function(){ fromHash(); render(true); });
  fromHash();
  render();

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (location.hash || reduce) enter();
})();

</script>
